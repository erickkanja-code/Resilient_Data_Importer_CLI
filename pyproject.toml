[project]
name = "git-powered-configuration-management-cli"
version = "0.1.0"
description = ""
authors = [
    {name = "Erick Kanja",email = "e.kanja@alustudent.com"}
]
requires-python = ">=3.14"
dependencies = [
    "gitpython (>=3.2.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
dev = [
    "ruff (>=0.17.1,<0.18.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "mypy (>=2.4.0,<3.0.0)"
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]